      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(36, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(42, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(48, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(54, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="191" stroke="#5C5449" stroke-width="3" stroke-linecap="round" transform="rotate(60, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(66, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(72, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(78, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(84, 240, 315)"/>

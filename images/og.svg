      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(342, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(348, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(354, 240, 315)"/>
    </g>

    <!-- (5) Coral Elapsed Sector (12 o'clock to 3 o'clock, opacity 0.4) -->
    <path d="M 240 315 L 240 173 A 142 142 0 0 1 382 315 Z" fill="#F2A2A2" opacity="0.4"/>

    <!-- (6) The Hand: Tapered needle #F2A2A2 pointing at 45 deg, lance tip #E89090, tail, white ridge -->
    <g transform="rotate(45, 240, 315)">
      <!-- Counterweight Tail -->
      <polygon points="236,315 238,342 242,342 244,315" fill="#F2A2A2"/>
      <circle cx="240" cy="342" r="8" fill="#F2A2A2"/>
      <!-- Tapered Needle Body -->
      <polygon points="235,315 238.5,202 241.5,202 245,315" fill="#F2A2A2"/>
      <!-- Lance Tip -->
      <polygon points="238.5,202 236.5,195 240,178 243.5,195 241.5,202" fill="#E89090"/>
      <!-- White Center Ridge Line -->
      <line x1="240" y1="346" x2="240" y2="182" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- (7) Center Pivot: outer #5C5449 r=16, inner #F2A2A2 r=9, tiny white highlight -->
    <circle cx="240" cy="315" r="16" fill="#5C5449"/>
    <circle cx="240" cy="315" r="9" fill="#F2A2A2"/>
    <circle cx="237" cy="312" r="3" fill="#FFFFFF"/>

    <!-- (8) Small Sub-dial at 6 o'clock: circle #FDF9F1, #F5EDE4 rim, four #B3A898 ticks, #5C5449 pointer -->
    <g id="sub-dial">
      <circle cx="240" cy="382" r="30" fill="#FDF9F1" stroke="#F5EDE4" stroke-width="2.5"/>
      <line x1="240" y1="355" x2="240" y2="361" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="240" y1="403" x2="240" y2="409" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="213" y1="382" x2="219" y2="382" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="261" y1="382" x2="267" y2="382" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="240" y1="382" x2="252" y2="368" stroke="#5C5449" stroke-width="2" stroke-linecap="round"/>
      <circle cx="240" cy="382" r="2.5" fill="#5C5449"/>
    </g>

    <!-- (9) Watch Crown & Buttons: top ridged knob #B3A898 + knurl ridges #F5EDE4 + white bevel, 2 angled buttons at 45 deg -->
    <!-- Upper Left Button -->
    <g transform="rotate(-45, 240, 315)">
      <rect x="234" y="142" width="12" height="16" rx="1" fill="#B3A898"/>
      <rect x="226" y="128" width="28" height="14" rx="3" fill="#B3A898"/>
      <rect x="228" y="126" width="24" height="3" rx="1.5" fill="#FFFFFF"/>
    </g>
    <!-- Upper Right Button -->
    <g transform="rotate(45, 240, 315)">
      <rect x="234" y="142" width="12" height="16" rx="1" fill="#B3A898"/>
      <rect x="226" y="128" width="28" height="14" rx="3" fill="#B3A898"/>
      <rect x="228" y="126" width="24" height="3" rx="1.5" fill="#FFFFFF"/>
    </g>
    <!-- Top Crown Knob -->
    <rect x="233" y="138" width="14" height="18" fill="#B3A898"/>
    <rect x="220" y="114" width="40" height="24" rx="4" fill="#B3A898"/>
    <!-- Knurl Ridges -->
    <line x1="225" y1="116" x2="225" y2="136" stroke="#F5EDE4" stroke-width="1.5"/>
    <line x1="230" y1="116" x2="230" y2="136" stroke="#F5EDE4" stroke-width="1.5"/>
    <line x1="235" y1="116" x2="235" y2="136" stroke="#F5EDE4" stroke-width="1.5"/>
    <line x1="240" y1="116" x2="240" y2="136" stroke="#F5EDE4" stroke-width="1.5"/>
    <line x1="245" y1="116" x2="245" y2="136" stroke="#F5EDE4" stroke-width="1.5"/>
    <line x1="250" y1="116" x2="250" y2="136" stroke="#F5EDE4" stroke-width="1.5"/>
    <line x1="255" y1="116" x2="255" y2="136" stroke="#F5EDE4" stroke-width="1.5"/>
    <!-- White Top Bevel -->
    <rect x="222" y="112" width="36" height="3" rx="1.5" fill="#FFFFFF"/>

    <!-- (10) White Glass Reflection Arc at low opacity across upper-left -->
    <path d="M 124 235 A 134 134 0 0 1 210 181 A 122 122 0 0 0 138 248 Z" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- Right Zone Text -->
  <g font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="540" y="230" fill="#5C5449" font-size="96" font-weight="800" letter-spacing="-2">Progressive</text>
    <text x="540" y="330" fill="#F2A2A2" font-size="96" font-weight="800" letter-spacing="-2">Pomodoro</text>
    <text x="540" y="404" fill="#756B5C" font-size="34" font-weight="600">
      <tspan x="540" dy="0">Adaptive focus timer — start short,</tspan>
      <tspan x="540" dy="46">rate your focus, go deeper.</tspan>
    </text>
  </g>
</svg>

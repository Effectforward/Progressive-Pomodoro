      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(252, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(258, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(264, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="191" stroke="#5C5449" stroke-width="3" stroke-linecap="round" transform="rotate(270, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(276, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(282, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(288, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(294, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="191" stroke="#5C5449" stroke-width="3" stroke-linecap="round" transform="rotate(300, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(306, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(312, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(318, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(324, 240, 315)"/>

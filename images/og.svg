<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FDF9F1"/>

  <!-- Left Zone: Large Mechanical Stopwatch (Centered at x=240, y=315, Dial Diameter=320 -> R=160) -->
  <g id="stopwatch">
    <!-- (1) Outer Case Ring -->
    <circle cx="240" cy="315" r="160" fill="#F5EDE4"/>

    <!-- (2) White Dial Face -->
    <circle cx="240" cy="315" r="142" fill="#FFFFFF"/>

    <!-- (3) Three Concentric Thin Rings at radii 85%, 65%, 45% of dial (142) -->
    <circle cx="240" cy="315" r="120.7" fill="none" stroke="#F5EDE4" stroke-width="1.5"/>
    <circle cx="240" cy="315" r="92.3" fill="none" stroke="#F5EDE4" stroke-width="1.5"/>
    <circle cx="240" cy="315" r="63.9" fill="none" stroke="#F5EDE4" stroke-width="1.5"/>

    <!-- (4) Ticks: 60 fine sub-ticks #B3A898 and 12 major ticks #5C5449 stroke-width 3 -->
    <g id="dial-ticks">
      <line x1="240" y1="177" x2="240" y2="191" stroke="#5C5449" stroke-width="3" stroke-linecap="round" transform="rotate(0, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(6, 240, 315)"/>

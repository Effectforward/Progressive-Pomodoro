      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(138, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(144, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="191" stroke="#5C5449" stroke-width="3" stroke-linecap="round" transform="rotate(150, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(156, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(162, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(168, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(174, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="191" stroke="#5C5449" stroke-width="3" stroke-linecap="round" transform="rotate(180, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(186, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(192, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(198, 240, 315)"/>
      <line x1="240" y1="177" x2="240" y2="184" stroke="#B3A898" stroke-width="1.5" stroke-linecap="round" transform="rotate(204, 240, 315)"/>

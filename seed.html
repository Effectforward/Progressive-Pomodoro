<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Seed Year of Data</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.5; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; }
    .log { margin-top: 20px; font-family: monospace; white-space: pre-wrap; background: #f5f5f5; padding: 15px; max-height: 300px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Seed 365 Days of Progressive Pomodoro Data</h1>
  <p>This will populate localStorage with a realistic year of sessions across all heatmap levels, ratings, and patterns.</p>
  <button id="seedBtn">Seed Data & Open App</button>
  <div id="log" class="log"></div>

  <script>
    const log = document.getElementById('log');
    function l(msg) { log.textContent += msg + '\n'; log.scrollTop = log.scrollHeight; }

    function localDateKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

    document.getElementById('seedBtn').onclick = async () => {
      l('Generating 365 days of sessions...');
      const sessions = [];
      const now = new Date();
      const ratings = ['flow', 'focused', 'good', 'distracted'];
      const ratingWeights = [0.15, 0.25, 0.35, 0.25]; // biased toward good/focused

      function pickRating() {
        const r = Math.random();
        let sum = 0;
        for (let i = 0; i < ratings.length; i++) {
          sum += ratingWeights[i];
          if (r < sum) return ratings[i];
        }
        return ratings[ratings.length - 1];
      }

      // Generate sessions for each day going back 365 days
      for (let dayOffset = 364; dayOffset >= 0; dayOffset--) {
        const date = new Date(now);
        date.setDate(date.getDate() - dayOffset);
        date.setHours(0, 0, 0, 0);

        // 70% of days have at least one session
        if (Math.random() > 0.30) {
          // Number of sessions that day (1-3, weighted toward 1)
          const numSessions = Math.random() < 0.65 ? 1 : (Math.random() < 0.9 ? 2 : 3);

          for (let s = 0; s < numSessions; s++) {
            // Session length: varied to hit all heatmap levels
            // Use a distribution that naturally covers 0-240+ min across the year
            let minutes;
            const r = Math.random();
            if (r < 0.10) minutes = Math.floor(Math.random() * 10) + 1;           // 1-10 (level 1)
            else if (r < 0.20) minutes = Math.floor(Math.random() * 20) + 11;        // 11-30 (level 1-2)
            else if (r < 0.30) minutes = Math.floor(Math.random() * 30) + 31;        // 31-60 (level 2)
            else if (r < 0.40) minutes = Math.floor(Math.random() * 30) + 61;        // 61-90 (level 3)
            else if (r < 0.50) minutes = Math.floor(Math.random() * 30) + 91;        // 91-120 (level 4)
            else if (r < 0.60) minutes = Math.floor(Math.random() * 30) + 121;       // 121-150 (level 5)
            else if (r < 0.70) minutes = Math.floor(Math.random() * 30) + 151;       // 151-180 (level 6)
            else if (r < 0.80) minutes = Math.floor(Math.random() * 30) + 181;       // 181-210 (level 7)
            else if (r < 0.90) minutes = Math.floor(Math.random() * 30) + 211;       // 211-240 (level 8)
            else minutes = Math.floor(Math.random() * 120) + 241;                    // 240+ (level 8)

            const lengthSec = minutes * 60;
            const rating = pickRating();
            const auto = Math.random() < 0.15; // 15% auto-completed

            // Add some time-of-day variation
            const hour = 6 + Math.floor(Math.random() * 16); // 6am-10pm
            const minute = Math.floor(Math.random() * 60);
            const timestamp = new Date(date.getTime() + hour * 3600000 + minute * 60000).toISOString();

            sessions.push({ rating, length: lengthSec, timestamp, auto });
          }
        }
      }

      // Also add a few "today" sessions for current day visibility
      const today = new Date();
      for (let i = 0; i < 2; i++) {
        const minutes = 25 + Math.floor(Math.random() * 30);
        sessions.push({
          rating: pickRating(),
          length: minutes * 60,
          timestamp: new Date(today.getTime() - (2-i)*3600000).toISOString(),
          auto: false
        });
      }

      l(`Generated ${sessions.length} sessions across ${new Set(sessions.map(s => localDateKey(new Date(s.timestamp)))).size} days`);

      // Compute stats for preview
      let totalMin = 0, totalSessions = 0, best = 0, rated = 0, good = 0, thisWeek = 0, monthTotal = 0;
      const weekAgo = new Date(now.getTime() - 7*86400000);
      const monthAgo = new Date(now.getTime() - 30*86400000);

      for (const s of sessions) {
        const mins = Math.round(s.length / 60);
        totalMin += mins;
        totalSessions++;
        best = Math.max(best, mins);
        const d = new Date(s.timestamp);
        if (d >= weekAgo) thisWeek += mins;
        if (d >= monthAgo) monthTotal += mins;
        if (s.rating) { rated++; if (s.rating === 'flow' || s.rating === 'focused') good++; }
      }

      const pct = rated ? Math.round((good / rated) * 100) : 0;
      l(`\nStats preview:`);
      l(`  Total focus: ${totalMin}m (${Math.round(totalMin/60)}h ${totalMin%60}m)`);
      l(`  Sessions: ${totalSessions}`);
      l(`  Best session: ${best}m`);
      l(`  This week: ${thisWeek}m`);
      l(`  Last 30 days: ${monthTotal}m`);
      l(`  Rated: ${rated} (${good} flow/focused = ${pct}%)`);

      // Heatmap level distribution
      const levels = {};
      const dayMinutes = {};
      for (const s of sessions) {
        const key = localDateKey(new Date(s.timestamp));
        dayMinutes[key] = (dayMinutes[key] || 0) + Math.round(s.length / 60);
      }
      for (const mins of Object.values(dayMinutes)) {
        const lvl = mins === 0 ? 0 : Math.min(8, Math.ceil(mins / 30));
        levels[lvl] = (levels[lvl] || 0) + 1;
      }
      l(`\nHeatmap level distribution:`);
      for (let l = 0; l <= 8; l++) {
        if (levels[l]) l(`  Level ${l}: ${levels[l]} days`);
      }

      // Save to localStorage
      localStorage.setItem('pp_sessions_v1', JSON.stringify(sessions));
      l('\nSaved to localStorage (pp_sessions_v1).');

      // Ensure settings exist
      if (!localStorage.getItem('pp_settings_v1')) {
        localStorage.setItem('pp_settings_v1', JSON.stringify({
          warmup: 5, break: 5, autoRestart: 0, timerSize: 'regular',
          theme: 'warm', settingsLayout: 'sidebar', sideBySideLayout: true,
          tasksCardVisible: true, historyCardVisible: true, showBeatsAutoStart: true,
          githubVisible: true, statsVisible: true,
          alarmSound: 'chord', beatsAutoStart: false,
          beatsLeftFreq: 340, beatsRightFreq: 380, beatsVolume: 0.5,
          beatsPreset: 'gamma'
        }));
        l('Default settings created.');
      }

      l('\nRedirecting to app...');
      setTimeout(() => location.href = '/', 500);
    };
  </script>
</body>
</html>
